<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>店頭自動案内アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000; color: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    video#webcam {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #video-player {
      position: absolute; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: contain;
      background: #000;
      display: none; z-index: 50;
    }
    .overlay-ui {
      position: absolute; top: 20px; right: 20px;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 24px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: right; z-index: 10;
    }
    .status-badge { font-size: 1.2rem; font-weight: bold; margin-bottom: 6px; }
    .status-badge.detecting { color: #4ade80; }
    .status-badge.searching { color: #9ca3af; }
    .status-badge.waiting { color: #f97316; }
    .timer-display { font-size: 1rem; color: #facc15; font-family: monospace; }
    
    /* 店主呼び出し赤ボタン */
    #call-button-container {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
    }
    .call-btn {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      border: 3px solid #fecaca;
      padding: 18px 36px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5), 0 0 15px rgba(255, 255, 255, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .call-btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }
    .call-btn.sent {
      background: #10b981;
      border-color: #a7f3d0;
    }

    #error-msg {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(220, 38, 38, 0.9); color: #fff;
      padding: 12px 20px; border-radius: 8px; font-size: 0.9rem;
      display: none; z-index: 60; max-width: 80%;
    }
    #start-screen {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .btn {
      background: #2563eb; color: #fff; border: none;
      padding: 16px 32px; font-size: 1.2rem; border-radius: 8px;
      cursor: pointer; margin-top: 15px; font-weight: bold;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div id="container">
  <video id="webcam" autoplay playsinline muted></video>

  <div class="overlay-ui">
    <div id="status" class="status-badge searching">⚪ カメラ準備中...</div>
    <div id="timer" class="timer-display">計測: 0.0 秒 / 4.0 秒</div>
  </div>

  <!-- 店主呼び出し赤ボタン -->
  <div id="call-button-container">
    <button class="call-btn" id="call-btn" onclick="sendNtfyAlert()">
      🔔 店主呼び出しはこちら
    </button>
  </div>

  <div id="error-msg"></div>
  
  <video id="video-player" playsinline webkit-playsinline></video>

  <div id="start-screen">
    <h2>店頭案内システム</h2>
    <p style="margin-top: 10px; color: #ccc;">下のボタンを押してシステムを開始します。</p>
    <button class="btn" onclick="startSystem()">システムスタート</button>
  </div>
</div>

<script>
  // ★ アンダーバー版のトピック名に変更済み
  const NTFY_TOPIC = "miseban_call_8938";

  const videoList = Array.from({ length: 10 }, (_, i) => {
    const num = String(i + 1).padStart(2, '0');
    return `${num}.mp4`;
  });

  const TARGET_SECONDS = 4.0;
  const WAITING_TIMEOUT_SECONDS = 30.0;

  let videoEl, playerEl, callBtnContainer, callBtn;
  let detectionStartTime = null;
  let waitingStartTime = null;
  let isPlaying = false;
  let requireLeaveFirst = false;
  let lastPlayedIndex = -1;
  let procCanvas, procCtx;
  let isSending = false;

  async function startSystem() {
    document.getElementById('start-screen').style.display = 'none';
    videoEl = document.getElementById('webcam');
    playerEl = document.getElementById('video-player');
    callBtnContainer = document.getElementById('call-button-container');
    callBtn = document.getElementById('call-btn');

    procCanvas = document.createElement('canvas');
    procCanvas.width = 160;
    procCanvas.height = 120;
    procCtx = procCanvas.getContext('2d');

    playerEl.load();

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      videoEl.srcObject = stream;
      await videoEl.play();

      document.getElementById('status').innerText = '⚪ 待機中（人を探しています）';
      detectLoop();
    } catch (err) {
      showError("カメラの起動に失敗しました: " + err);
    }
  }

  // ★ ntfy.sh プッシュ通知送信処理
  async function sendNtfyAlert() {
    if (isSending) return;
    isSending = true;

    callBtn.innerText = "⏳ 呼び出し中...";
    callBtn.style.pointerEvents = "none";

    try {
      const res = await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
        method: "POST",
        headers: {
          "Title": "店頭呼び出し",
          "Priority": "urgent",
          "Tags": "bell,warning"
        },
        body: "お客様が店頭で店主を呼び出しています！"
      });

      if (res.ok) {
        callBtn.classList.add("sent");
        callBtn.innerText = "✅ 店主へ通知しました";
      } else {
        throw new Error("HTTP " + res.status);
      }
    } catch (e) {
      callBtn.innerText = "⚠️ 送信失敗（電波確認）";
    }

    setTimeout(() => {
      callBtn.classList.remove("sent");
      callBtn.innerText = "🔔 店主呼び出しはこちら";
      callBtn.style.pointerEvents = "auto";
      isSending = false;
    }, 5000);
  }

  function detectLoop() {
    if (!isPlaying && videoEl.videoWidth > 0) {
      const isPersonDetected = checkPersonPresence();
      handleDetection(isPersonDetected);
    }

    setTimeout(detectLoop, 150);
  }

  function checkPersonPresence() {
    procCtx.drawImage(videoEl, 0, 0, procCanvas.width, procCanvas.height);
    const frame = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
    const data = frame.data;
    let skinPixels = 0;

    for (let i = 0; i < data.length; i += 8) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];

      if (r > 60 && g > 30 && b > 15 && r > g && r > b && (r - g > 8)) {
        skinPixels++;
      }
    }

    return skinPixels > 140;
  }

  function handleDetection(detected) {
    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');

    if (requireLeaveFirst) {
      const waitingElapsed = (Date.now() - waitingStartTime) / 1000;

      // 30秒経過で強制次再生
      if (waitingElapsed >= WAITING_TIMEOUT_SECONDS) {
        requireLeaveFirst = false;
        waitingStartTime = null;
        playRandomVideo();
        return;
      }

      if (!detected) {
        requireLeaveFirst = false;
        waitingStartTime = null;
        detectionStartTime = null;
        statusEl.className = 'status-badge searching';
        statusEl.innerText = '⚪ 待機中（人を探しています）';
        timerEl.innerText = `計測: 0.0 秒 / ${TARGET_SECONDS.toFixed(1)} 秒`;
        return;
      }

      const remain = Math.max(0, WAITING_TIMEOUT_SECONDS - waitingElapsed);
      statusEl.className = 'status-badge waiting';
      statusEl.innerText = '⚪ 待機中（次の案内まで）';
      timerEl.innerText = `次まで: ${remain.toFixed(1)} 秒`;
      return;
    }

    if (detected) {
      statusEl.className = 'status-badge detecting';
      statusEl.innerText = '👤 人物を検知中';

      if (!detectionStartTime) {
        detectionStartTime = Date.now();
      }

      const elapsed = (Date.now() - detectionStartTime) / 1000;
      timerEl.innerText = `計測: ${elapsed.toFixed(1)} 秒 / ${TARGET_SECONDS.toFixed(1)} 秒`;

      if (elapsed >= TARGET_SECONDS) {
        playRandomVideo();
      }
    } else {
      detectionStartTime = null;
      statusEl.className = 'status-badge searching';
      statusEl.innerText = '⚪ 待機中（人を探しています）';
      timerEl.innerText = `計測: 0.0 秒 / ${TARGET_SECONDS.toFixed(1)} 秒`;
    }
  }

  function playRandomVideo() {
    if (videoList.length === 0) {
      showError("動画リストが空です。");
      return;
    }

    isPlaying = true;
    detectionStartTime = null;
    waitingStartTime = null;

    if (callBtnContainer) callBtnContainer.style.display = 'none';

    let randomIndex;
    if (videoList.length > 1) {
      do {
        randomIndex = Math.floor(Math.random() * videoList.length);
      } while (randomIndex === lastPlayedIndex);
    } else {
      randomIndex = 0;
    }
    
    lastPlayedIndex = randomIndex;
    const selectedVideo = videoList[randomIndex];

    hideError();
    playerEl.src = selectedVideo;
    playerEl.style.display = 'block';
    
    playerEl.load();
    const playPromise = playerEl.play();

    if (playPromise !== undefined) {
      playPromise.catch(err => {
        showError(`動画【${selectedVideo}】の再生に失敗しました。「店番」フォルダ内にファイルがあるかご確認ください。`);
        playerEl.style.display = 'none';
        isPlaying = false;
        detectionStartTime = null;
        if (callBtnContainer) callBtnContainer.style.display = 'block';
      });
    }

    playerEl.onended = () => {
      playerEl.style.display = 'none';
      isPlaying = false;
      
      if (callBtnContainer) callBtnContainer.style.display = 'block';

      requireLeaveFirst = true;
      waitingStartTime = Date.now();
      detectionStartTime = null;

      const statusEl = document.getElementById('status');
      const timerEl = document.getElementById('timer');
      statusEl.className = 'status-badge waiting';
      statusEl.innerText = '⚪ 待機中（次の案内まで）';
      timerEl.innerText = `次まで: ${WAITING_TIMEOUT_SECONDS.toFixed(1)} 秒`;
    };
  }

  function showError(msg) {
    const errEl = document.getElementById('error-msg');
    errEl.innerText = msg;
    errEl.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error-msg').style.display = 'none';
  }
</script>
</body>
</html>
