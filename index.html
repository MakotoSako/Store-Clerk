<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>店頭自動案内アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000; color: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    video#webcam {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #video-player {
      position: absolute; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: contain;
      background: #000;
      display: none; z-index: 50;
    }
    .overlay-ui {
      position: absolute; top: 20px; right: 20px;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 24px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: right; z-index: 10;
    }
    .status-badge { font-size: 1.2rem; font-weight: bold; margin-bottom: 6px; }
    .status-badge.detecting { color: #4ade80; }
    .status-badge.searching { color: #9ca3af; }
    .timer-display { font-size: 1rem; color: #facc15; font-family: monospace; }
    
    #error-msg {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(220, 38, 38, 0.9); color: #fff;
      padding: 12px 20px; border-radius: 8px; font-size: 0.9rem;
      display: none; z-index: 60; max-width: 80%;
    }
    #start-screen {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .btn {
      background: #2563eb; color: #fff; border: none;
      padding: 16px 32px; font-size: 1.2rem; border-radius: 8px;
      cursor: pointer; margin-top: 15px; font-weight: bold;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div id="container">
  <video id="webcam" autoplay playsinline muted></video>

  <div class="overlay-ui">
    <div id="status" class="status-badge searching">⚪ カメラ準備中...</div>
    <div id="timer" class="timer-display">計測: 0.0 秒 / 4.0 秒</div>
  </div>

  <div id="error-msg"></div>
  
  <!-- iPad対策：playsinline, webkit-playsinline 属性を付与 -->
  <video id="video-player" playsinline webkit-playsinline></video>

  <div id="start-screen">
    <h2>店頭案内システム</h2>
    <p style="margin-top: 10px; color: #ccc;">下のボタンを押してシステムを開始します。</p>
    <button class="btn" onclick="startSystem()">システムスタート</button>
  </div>
</div>

<script>
  const videoList = Array.from({ length: 10 }, (_, i) => {
    const num = String(i + 1).padStart(2, '0');
    return `${num}.mp4`;
  });

  const TARGET_SECONDS = 4.0;

  let videoEl, playerEl;
  let detectionStartTime = null;
  let isPlaying = false;
  let hasPlayedInThisSession = false;
  let lastPlayedIndex = -1;
  let faceDetector = null;

  async function startSystem() {
    document.getElementById('start-screen').style.display = 'none';
    videoEl = document.getElementById('webcam');
    playerEl = document.getElementById('video-player');

    // ★ iPad対策：最初のボタンタップ時に動画の無音ダミー再生をして自動再生権限（アンロック）を取得
    playerEl.load();

    if ('FaceDetector' in window) {
      try {
        faceDetector = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
      } catch (e) {
        faceDetector = null;
      }
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });
      videoEl.srcObject = stream;
      videoEl.onloadedmetadata = () => {
        document.getElementById('status').innerText = '⚪ 待機中（人を探しています）';
        detectLoop();
      };
    } catch (err) {
      showError("カメラの起動に失敗しました: " + err);
    }
  }

  async function detectLoop() {
    if (!isPlaying && videoEl.readyState === 4) {
      let isPersonDetected = false;

      if (faceDetector) {
        try {
          const faces = await faceDetector.detect(videoEl);
          isPersonDetected = faces.length > 0;
        } catch (e) {
          isPersonDetected = fallbackSkinDetection();
        }
      } else {
        isPersonDetected = fallbackSkinDetection();
      }

      handleDetection(isPersonDetected);
    }

    setTimeout(detectLoop, 150);
  }

  function fallbackSkinDetection() {
    const canvas = document.createElement('canvas');
    canvas.width = 320;
    canvas.height = 240;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
    
    const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = frame.data;
    let skinPixels = 0;

    for (let i = 0; i < data.length; i += 16) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];

      if (r > 95 && g > 40 && b > 20 && r > g && r > b && (r - g > 15) && Math.abs(r - g) > 15) {
        skinPixels++;
      }
    }

    return skinPixels > 450;
  }

  function handleDetection(detected) {
    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');

    if (detected) {
      if (hasPlayedInThisSession) {
        statusEl.className = 'status-badge searching';
        statusEl.innerText = '⚪ 待機中（離脱待ち）';
        timerEl.innerText = '計測: 完了';
        return;
      }

      statusEl.className = 'status-badge detecting';
      statusEl.innerText = '👤 人物を検知中';

      if (!detectionStartTime) {
        detectionStartTime = Date.now();
      }

      const elapsed = (Date.now() - detectionStartTime) / 1000;
      timerEl.innerText = `計測: ${elapsed.toFixed(1)} 秒 / ${TARGET_SECONDS.toFixed(1)} 秒`;

      if (elapsed >= TARGET_SECONDS) {
        playRandomVideo();
      }
    } else {
      detectionStartTime = null;
      hasPlayedInThisSession = false;
      
      statusEl.className = 'status-badge searching';
      statusEl.innerText = '⚪ 待機中（人を探しています）';
      timerEl.innerText = `計測: 0.0 秒 / ${TARGET_SECONDS.toFixed(1)} 秒`;
    }
  }

  function playRandomVideo() {
    if (videoList.length === 0) {
      showError("動画リストが空です。");
      return;
    }

    isPlaying = true;
    detectionStartTime = null;

    let randomIndex;
    if (videoList.length > 1) {
      do {
        randomIndex = Math.floor(Math.random() * videoList.length);
      } while (randomIndex === lastPlayedIndex);
    } else {
      randomIndex = 0;
    }
    
    lastPlayedIndex = randomIndex;
    const selectedVideo = videoList[randomIndex];

    hideError();
    playerEl.src = selectedVideo;
    playerEl.style.display = 'block';
    
    // ★ iPad対策：明示的にロードを呼び出してからPlayを実行
    playerEl.load();
    const playPromise = playerEl.play();

    if (playPromise !== undefined) {
      playPromise.catch(err => {
        showError(`動画【${selectedVideo}】の再生に失敗しました。iPadのフォルダ内にファイルがあるかご確認ください: ` + err);
        playerEl.style.display = 'none';
        isPlaying = false;
      });
    }

    playerEl.onended = () => {
      playerEl.style.display = 'none';
      isPlaying = false;
      hasPlayedInThisSession = true;

      const statusEl = document.getElementById('status');
      const timerEl = document.getElementById('timer');
      statusEl.className = 'status-badge searching';
      statusEl.innerText = '⚪ 待機中（人を探しています）';
      timerEl.innerText = `計測: 0.0 秒 / ${TARGET_SECONDS.toFixed(1)} 秒`;
    };
  }

  function showError(msg) {
    const errEl = document.getElementById('error-msg');
    errEl.innerText = msg;
    errEl.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error-msg').style.display = 'none';
  }
</script>
</body>
</html>
