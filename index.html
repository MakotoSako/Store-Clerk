<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 店番デジタルサイネージ</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MediaPipe Face Detection & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

    <style>
        /* タッチ＆スクロール誤動作防止 (iPad設置用) */
        body {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* 鏡像反転 (フロントカメラ映像用) */
        .mirror {
            transform: scaleX(-1);
        }

        /* プログレスリング用アニメーション */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between relative select-none">

    <!-- 初回起動時（ブラウザの自動再生制限解除用）モーダル -->
    <div id="startOverlay" class="fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-lg shadow-2xl space-y-6">
            <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="store" class="w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white mb-2">AI店番サイネージ</h1>
                <p class="text-slate-300 text-sm leading-relaxed">
                    iPadのカメラで人物を認識し、6秒以上立っているお客様に自動で動画を再生します。画面をタップして開始してください。
                </p>
            </div>
            <button id="btnStart" class="w-full py-4 bg-blue-600 hover:bg-blue-500 active:scale-95 transition text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg">
                <i data-lucide="play" class="w-5 h-5"></i>
                システムを起動する
            </button>
        </div>
    </div>

    <!-- メインコンテンツ領域（カメラ表示・検出インターフェース） -->
    <main class="relative flex-1 w-full h-full flex flex-col items-center justify-center overflow-hidden">
        
        <!-- カメラ映像ビュー -->
        <div id="cameraContainer" class="relative w-full h-full flex items-center justify-center bg-black overflow-hidden">
            <video id="webcam" class="absolute inset-0 w-full h-full object-cover mirror" playsinline muted></video>
            <canvas id="outputCanvas" class="absolute inset-0 w-full h-full object-cover mirror pointer-events-none"></canvas>

            <!-- 非表示時のプライバシーオーバーレイ -->
            <div id="cameraHiddenOverlay" class="hidden absolute inset-0 bg-slate-950 flex flex-col items-center justify-center text-slate-500">
                <i data-lucide="camera-off" class="w-16 h-16 mb-2"></i>
                <p class="text-sm">カメラプレビューは非表示設定になっています</p>
            </div>
        </div>

        <!-- オーバーレイUI (検出ステータス & タイマー) -->
        <div class="absolute inset-x-0 top-0 p-6 flex justify-between items-start pointer-events-none z-10 bg-gradient-to-b from-black/70 via-black/20 to-transparent">
            <!-- 左側: ステータスバッジ -->
            <div class="flex items-center gap-3">
                <div id="statusBadge" class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-900/80 border border-slate-700/80 backdrop-blur-md transition-all duration-300">
                    <span id="statusDot" class="w-3 h-3 rounded-full bg-slate-500 animate-pulse"></span>
                    <span id="statusText" class="text-sm font-medium text-slate-300">カメラ準備中...</span>
                </div>
            </div>

            <!-- 右側: アクション＆設定ボタン -->
            <div class="pointer-events-auto flex items-center gap-3">
                <button id="btnOpenSettings" class="p-3 rounded-full bg-slate-900/80 hover:bg-slate-800 border border-slate-700 backdrop-blur-md transition text-slate-200 active:scale-95 shadow-md">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- 中央: 6秒カウントダウンプログレス -->
        <div id="timerContainer" class="absolute z-10 flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300">
            <div class="relative w-48 h-48 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="96" cy="96" r="80" stroke="currentColor" stroke-width="10" class="text-slate-800/80 fill-none" />
                    <circle id="progressCircle" cx="96" cy="96" r="80" stroke="currentColor" stroke-width="10" 
                            class="text-blue-500 fill-none progress-ring__circle" 
                            stroke-dasharray="502.65" stroke-dashoffset="502.65" stroke-linecap="round" />
                </svg>
                <div class="absolute flex flex-col items-center justify-center text-center">
                    <span id="timerText" class="text-4xl font-extrabold text-white tracking-tight">0.0</span>
                    <span class="text-xs text-slate-300 font-medium tracking-wider uppercase mt-1">秒注目中</span>
                </div>
            </div>
            <p class="mt-4 text-sm font-semibold text-white/90 bg-slate-900/80 px-4 py-1.5 rounded-full backdrop-blur-md border border-slate-700">
                まもなく案内動画が再生されます
            </p>
        </div>

        <!-- クールダウン中メッセージ -->
        <div id="cooldownContainer" class="hidden absolute z-10 bg-slate-900/90 border border-slate-700/80 px-6 py-4 rounded-2xl backdrop-blur-md flex items-center gap-3 shadow-xl">
            <i data-lucide="hourglass" class="w-6 h-6 text-amber-400 animate-spin"></i>
            <div>
                <p class="text-sm font-bold text-white">準備中 (クールダウン)</p>
                <p id="cooldownText" class="text-xs text-slate-400">次のお客様の検知を待機しています</p>
            </div>
        </div>
    </main>

    <!-- フルスクリーン動画再生プレイヤー -->
    <div id="videoOverlay" class="fixed inset-0 z-40 bg-black hidden flex items-center justify-center">
        <video id="player" class="w-full h-full object-contain" playsinline></video>
        <!-- 動画強制スキップボタン -->
        <button id="btnSkipVideo" class="absolute top-6 right-6 z-50 px-4 py-2 bg-black/60 border border-white/20 hover:bg-black/80 rounded-full text-xs text-white backdrop-blur-md flex items-center gap-2 transition active:scale-95">
            <i data-lucide="x" class="w-4 h-4"></i>
            閉じる
        </button>
    </div>

    <!-- 設定ドロワー/モータル -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex justify-end">
        <div class="w-full max-w-md bg-slate-900 h-full border-l border-slate-800 p-6 flex flex-col justify-between overflow-y-auto">
            <div class="space-y-6">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="sliders" class="w-5 h-5 text-blue-400"></i>
                        システム設定
                    </h2>
                    <button id="btnCloseSettings" class="p-2 text-slate-400 hover:text-white transition">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- 動画リスト設定 -->
                <div class="space-y-3">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">再生動画リスト</label>
                    <div id="videoList" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                        <!-- 動的生成動画アイテム -->
                    </div>
                    
                    <!-- 動画追加フォーム -->
                    <div class="space-y-2 pt-2 border-t border-slate-800/80">
                        <div class="flex gap-2">
                            <input type="file" id="videoFileInput" accept="video/mp4,video/webm" class="hidden" multiple />
                            <button id="btnUploadVideo" class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium rounded-lg flex items-center justify-center gap-2 transition">
                                <i data-lucide="upload" class="w-4 h-4"></i>
                                ローカル動画を追加
                            </button>
                        </div>
                        <div class="flex gap-2">
                            <input type="url" id="videoUrlInput" placeholder="https://example.com/video.mp4" class="flex-1 bg-slate-950 border border-slate-800 text-xs text-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500" />
                            <button id="btnAddUrlVideo" class="py-2 px-3 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition">
                                追加
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 検知パラメーター設定 -->
                <div class="space-y-4 pt-4 border-t border-slate-800">
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-300 font-medium">発火までの検知時間 (秒)</span>
                            <span id="targetTimeVal" class="text-blue-400 font-bold">6.0 秒</span>
                        </div>
                        <input type="range" id="targetTimeRange" min="2" max="15" step="0.5" value="6" class="w-full accent-blue-500 bg-slate-800 rounded-lg h-2" />
                    </div>

                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-300 font-medium">再生後クールダウン (秒)</span>
                            <span id="cooldownVal" class="text-blue-400 font-bold">5 秒</span>
                        </div>
                        <input type="range" id="cooldownRange" min="1" max="20" step="1" value="5" class="w-full accent-blue-500 bg-slate-800 rounded-lg h-2" />
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <span class="text-xs font-medium text-slate-300">カメラ映像を表示する</span>
                        <input type="checkbox" id="toggleCameraPreview" checked class="w-4 h-4 accent-blue-500 rounded cursor-pointer" />
                    </div>
                </div>
            </div>

            <div class="pt-6 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-500">GitHub Pages 対応 | Standalone Web App</p>
            </div>
        </div>
    </div>

    <script>
        // --- アプリケーション状態管理 ---
        const state = {
            isRunning: false,
            isPersonDetected: false,
            detectionStartTime: null,
            targetStayTime: 6.0, // デフォルト 6秒
            cooldownDuration: 5.0, // デフォルト 5秒
            isCoolingDown: false,
            isPlayingVideo: false,
            showCameraPreview: true,
            // デモ用のサンプル動画リスト
            videos: [
                { id: '1', name: 'デモプロモーション 1', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
                { id: '2', name: 'デモプロモーション 2', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' }
            ]
        };

        // DOM 要素
        const elements = {
            startOverlay: document.getElementById('startOverlay'),
            btnStart: document.getElementById('btnStart'),
            webcam: document.getElementById('webcam'),
            outputCanvas: document.getElementById('outputCanvas'),
            statusBadge: document.getElementById('statusBadge'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            timerContainer: document.getElementById('timerContainer'),
            timerText: document.getElementById('timerText'),
            progressCircle: document.getElementById('progressCircle'),
            cooldownContainer: document.getElementById('cooldownContainer'),
            cooldownText: document.getElementById('cooldownText'),
            videoOverlay: document.getElementById('videoOverlay'),
            player: document.getElementById('player'),
            btnSkipVideo: document.getElementById('btnSkipVideo'),
            btnOpenSettings: document.getElementById('btnOpenSettings'),
            btnCloseSettings: document.getElementById('btnCloseSettings'),
            settingsModal: document.getElementById('settingsModal'),
            videoList: document.getElementById('videoList'),
            videoFileInput: document.getElementById('videoFileInput'),
            btnUploadVideo: document.getElementById('btnUploadVideo'),
            videoUrlInput: document.getElementById('videoUrlInput'),
            btnAddUrlVideo: document.getElementById('btnAddUrlVideo'),
            targetTimeRange: document.getElementById('targetTimeRange'),
            targetTimeVal: document.getElementById('targetTimeVal'),
            cooldownRange: document.getElementById('cooldownRange'),
            cooldownVal: document.getElementById('cooldownVal'),
            toggleCameraPreview: document.getElementById('toggleCameraPreview'),
            cameraHiddenOverlay: document.getElementById('cameraHiddenOverlay')
        };

        let faceDetection = null;
        let camera = null;
        let animFrameId = null;
        const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 80; // 円周: r=80

        // Lucideアイコン初期化
        lucide.createIcons();

        // --- 初期化処理 ---
        elements.btnStart.addEventListener('click', async () => {
            elements.startOverlay.classList.add('hidden');
            await initCameraAndDetection();
            state.isRunning = true;
            requestAnimationFrame(updateLoop);
        });

        // --- カメラ & MediaPipe Face Detection の設定 ---
        async function initCameraAndDetection() {
            try {
                faceDetection = new FaceDetection({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
                });

                faceDetection.setOptions({
                    modelSelection: 0, // 0: 短距離検知 (2m以内、店頭用に最適)
                    minDetectionConfidence: 0.5
                });

                faceDetection.onResults(onDetectionResults);

                camera = new Camera(elements.webcam, {
                    onFrame: async () => {
                        if (state.isRunning && !state.isPlayingVideo) {
                            await faceDetection.send({ image: elements.webcam });
                        }
                    },
                    width: 1280,
                    height: 720
                });

                await camera.start();
                updateStatus('searching', '人感を検出中...');
            } catch (err) {
                console.error("Camera access error:", err);
                alert("カメラの起動に失敗しました。カメラ権限を許可してください。");
            }
        }

        // --- 顔検出結果のハンドリング ---
        function onDetectionResults(results) {
            if (state.isCoolingDown || state.isPlayingVideo) return;

            const hasFaces = results.detections && results.detections.length > 0;
            
            // 描画更新
            const canvasCtx = elements.outputCanvas.getContext('2d');
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, elements.outputCanvas.width, elements.outputCanvas.height);
            
            // アスペクト比補正
            elements.outputCanvas.width = elements.webcam.videoWidth;
            elements.outputCanvas.height = elements.webcam.videoHeight;

            if (hasFaces) {
                for (const detection of results.detections) {
                    const bbox = detection.boundingBox;
                    const x = bbox.xCenter * elements.outputCanvas.width - (bbox.width * elements.outputCanvas.width) / 2;
                    const y = bbox.yCenter * elements.outputCanvas.height - (bbox.height * elements.outputCanvas.height) / 2;
                    const w = bbox.width * elements.outputCanvas.width;
                    const h = bbox.height * elements.outputCanvas.height;

                    // 顔検出枠を描画 (透明感のある青色の枠)
                    canvasCtx.strokeStyle = '#3b82f6';
                    canvasCtx.lineWidth = 4;
                    canvasCtx.strokeRect(x, y, w, h);
                }
            }
            canvasCtx.restore();

            // タイマー状態アップデート
            if (hasFaces) {
                if (!state.isPersonDetected) {
                    state.isPersonDetected = true;
                    state.detectionStartTime = performance.now();
                    updateStatus('detected', '人物を検知中');
                }
            } else {
                if (state.isPersonDetected) {
                    state.isPersonDetected = false;
                    state.detectionStartTime = null;
                    updateStatus('searching', '人感を検出中...');
                }
            }
        }

        // --- メインアップデートループ (毎フレーム実行) ---
        function updateLoop(timestamp) {
            if (state.isPersonDetected && state.detectionStartTime && !state.isCoolingDown && !state.isPlayingVideo) {
                const elapsedSeconds = (timestamp - state.detectionStartTime) / 1000;
                const progress = Math.min(elapsedSeconds / state.targetStayTime, 1.0);

                // UIのプログレス表示更新
                elements.timerContainer.classList.remove('opacity-0');
                elements.timerText.innerText = elapsedSeconds.toFixed(1);
                
                const offset = CIRCLE_CIRCUMFERENCE - (progress * CIRCLE_CIRCUMFERENCE);
                elements.progressCircle.style.strokeDashoffset = offset;

                // 規定時間（例: 6秒）保持の達成判定
                if (elapsedSeconds >= state.targetStayTime) {
                    triggerVideoPlayback();
                }
            } else {
                elements.timerContainer.classList.add('opacity-0');
                elements.progressCircle.style.strokeDashoffset = CIRCLE_CIRCUMFERENCE;
            }

            requestAnimationFrame(updateLoop);
        }

        // --- 動画ランダム再生の発火 ---
        function triggerVideoPlayback() {
            if (state.videos.length === 0) {
                alert("再生可能な動画が登録されていません。設定画面から動画を追加してください。");
                state.isPersonDetected = false;
                state.detectionStartTime = null;
                return;
            }

            state.isPlayingVideo = true;
            state.isPersonDetected = false;
            state.detectionStartTime = null;

            // ランダムに動画を選択
            const randomIndex = Math.floor(Math.random() * state.videos.length);
            const targetVideo = state.videos[randomIndex];

            elements.player.src = targetVideo.url;
            elements.videoOverlay.classList.remove('hidden');

            // フルスクリーン化・再生
            elements.player.play().catch(err => {
                console.error("Playback failed:", err);
                closeVideoPlayer();
            });
        }

        // 動画終了イベント
        elements.player.addEventListener('ended', () => {
            closeVideoPlayer();
        });

        // 強制スキップボタン
        elements.btnSkipVideo.addEventListener('click', () => {
            elements.player.pause();
            closeVideoPlayer();
        });

        function closeVideoPlayer() {
            elements.videoOverlay.classList.add('hidden');
            elements.player.src = "";
            state.isPlayingVideo = false;
            startCooldown();
        }

        // --- クールダウン処理 (再生後の連続発火防止) ---
        function startCooldown() {
            state.isCoolingDown = true;
            updateStatus('cooldown', 'クールダウン中');
            elements.cooldownContainer.classList.remove('hidden');

            let remaining = state.cooldownDuration;
            elements.cooldownText.innerText = `待機時間: あと ${remaining} 秒`;

            const interval = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(interval);
                    state.isCoolingDown = false;
                    elements.cooldownContainer.classList.add('hidden');
                    updateStatus('searching', '人感を検出中...');
                } else {
                    elements.cooldownText.innerText = `待機時間: あと ${remaining} 秒`;
                }
            }, 1000);
        }

        // --- UIステータス表示切り替え ---
        function updateStatus(mode, text) {
            elements.statusText.innerText = text;
            elements.statusDot.className = "w-3 h-3 rounded-full ";
            
            if (mode === 'searching') {
                elements.statusDot.classList.add('bg-slate-500', 'animate-pulse');
            } else if (mode === 'detected') {
                elements.statusDot.classList.add('bg-emerald-500', 'animate-ping');
            } else if (mode === 'cooldown') {
                elements.statusDot.classList.add('bg-amber-500');
            }
        }

        // --- 設定＆カスタマイズ機能 ---
        elements.btnOpenSettings.addEventListener('click', () => {
            renderVideoList();
            elements.settingsModal.classList.remove('hidden');
        });

        elements.btnCloseSettings.addEventListener('click', () => {
            elements.settingsModal.classList.add('hidden');
        });

        // パラメーター変更イベント
        elements.targetTimeRange.addEventListener('input', (e) => {
            state.targetStayTime = parseFloat(e.target.value);
            elements.targetTimeVal.innerText = `${state.targetStayTime.toFixed(1)} 秒`;
        });

        elements.cooldownRange.addEventListener('input', (e) => {
            state.cooldownDuration = parseInt(e.target.value);
            elements.cooldownVal.innerText = `${state.cooldownDuration} 秒`;
        });

        elements.toggleCameraPreview.addEventListener('change', (e) => {
            state.showCameraPreview = e.target.checked;
            if (state.showCameraPreview) {
                elements.webcam.classList.remove('hidden');
                elements.cameraHiddenOverlay.classList.add('hidden');
            } else {
                elements.webcam.classList.add('hidden');
                elements.cameraHiddenOverlay.classList.remove('hidden');
            }
        });

        // 動画リスト管理機能
        function renderVideoList() {
            elements.videoList.innerHTML = '';
            state.videos.forEach((vid, idx) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs";
                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden mr-2">
                        <i data-lucide="video" class="w-4 h-4 text-blue-400 shrink-0"></i>
                        <span class="truncate text-slate-200 font-medium">${vid.name}</span>
                    </div>
                    <button onclick="removeVideo('${vid.id}')" class="text-slate-500 hover:text-red-400 p-1 transition shrink-0">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
                elements.videoList.appendChild(item);
            });
            lucide.createIcons();
        }

        window.removeVideo = function(id) {
            state.videos = state.videos.filter(v => v.id !== id);
            renderVideoList();
        };

        // ローカル動画ファイル追加
        elements.btnUploadVideo.addEventListener('click', () => elements.videoFileInput.click());
        elements.videoFileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                state.videos.push({
                    id: Date.now().toString() + Math.random(),
                    name: file.name,
                    url: url
                });
            });
            renderVideoList();
        });

        // URL動画追加
        elements.btnAddUrlVideo.addEventListener('click', () => {
            const url = elements.videoUrlInput.value.trim();
            if (url) {
                state.videos.push({
                    id: Date.now().toString(),
                    name: `外部動画 (${state.videos.length + 1})`,
                    url: url
                });
                elements.videoUrlInput.value = '';
                renderVideoList();
            }
        });
    </script>
</body>
</html>
